name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Android Release Bundle (AAB for Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Hindu Swaraj Debug APK (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: HinduSwaraj-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB (Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: HinduSwaraj-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
